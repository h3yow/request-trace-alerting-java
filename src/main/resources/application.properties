server.port=0

# ===== 链路 / 指标 / 告警配置 =====
# 慢请求判定阈值（毫秒）：耗时 >= 该值即慢请求；指标打点与告警判定共用此口径
observability.slow-request-threshold-ms=500
# 指标滑动窗口保留时长（毫秒）
observability.window-retention-ms=60000
# 每个接口窗口内样本数量上限（内存上界，超出淘汰最老样本）
observability.max-samples-per-endpoint=10000
# 接口维度键数量上限（超出并入 __OTHER__ 桶）
observability.max-endpoints=256
# 告警评估周期（毫秒）
observability.alert-evaluation-interval-ms=5000
# 触发告警要求异常状态连续成立的评估轮数
observability.trigger-consecutive-rounds=2
# 告警触发后的抑制窗口（毫秒）
observability.suppression-window-ms=60000
