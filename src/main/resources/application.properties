server.port=0

# 日志带上链路标识
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSS} %-5level [%thread] [%X{traceId:-no-trace}] %logger{36} - %msg%n

# 告警规则（默认值，见 AlertRule）
observability.alert.window-size-millis=60000
observability.alert.min-requests=10
observability.alert.max-error-rate=0.5
observability.alert.slow-threshold-millis=1000
observability.alert.max-slow-count=5
observability.alert.consecutive-windows=2
observability.alert.suppression-millis=300000
